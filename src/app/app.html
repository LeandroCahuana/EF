<div class="anniversary-container">

  <div class="card">

    <h1 class="title">{{ coupleName }}</h1>
    <h2 class="subtitle">{{ anniversaryYear }}</h2>

    <div class="image-section">
      <img src="Image1.jpeg" alt="Emely and Frank">
    </div>

    <div class="message">
      <p>{{ message }}</p>
    </div>

    <div class="gallery">
      <img src="Image2.jpeg" alt="Memory 1">
      <img src="Image3.jpeg" alt="Memory 2">
      <img src="Image4.jpeg" alt="Memory 3">
    </div>

  </div>

</div>
